<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dawn Patrol</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Mono:wght@400;500&display=swap">
<style>
:root { --night: #151a3c; --coral: #ff7a59; --sun: #ffd27a; --foam: #f5f0e4; --ink: #12102a; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  font: 14px/1.6 "DM Mono", ui-monospace, Menlo, monospace; color: var(--foam);
  background: linear-gradient(180deg, #151a3c 0%, #4a2f68 38%, #ff8a5c 62%, #ffd27a 70%, #1d4f6a 100%); }
main { width: 100%; max-width: 560px; display: grid; gap: 18px; }
h1 { margin: 0; font: 400 clamp(44px, 12vw, 72px)/0.92 "Bowlby One", "Arial Black", sans-serif; color: var(--coral); text-shadow: 3px 3px 0 var(--ink); }
p { margin: 0; text-shadow: 1px 1px 0 var(--ink); }
.pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
a.card { display: grid; gap: 6px; padding: 18px; border-radius: 6px; text-decoration: none; color: var(--foam);
  background: rgba(21, 26, 60, .86); border: 1.5px solid rgba(245, 240, 228, .25); }
a.card:hover, a.card:focus-visible { border-color: var(--sun); outline: none; }
a.card b { font: 400 26px "Bowlby One", sans-serif; color: var(--sun); }
a.card span { font-size: 12px; opacity: .85; }
</style>
</head>
<body>
<main>
  <h1>Dawn Patrol</h1>
  <p>A 3D surf game. Pick a version.</p>
  <div class="pick">
    <a class="card" href="v2/"><b>V2</b><span>The latest: level ladder, barrels, ice surf, shark packs, wildlife, Blender-made tiger shark and scanned reef rocks.</span></a>
    <a class="card" href="v1/"><b>V1</b><span>The original line, with its own V2 Super mode, levels and the second wave out the back.</span></a>
  </div>
</main>
</body>
</html>
